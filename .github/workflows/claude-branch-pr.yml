# Any push to a claude/* branch opens a draft PR if none exists, so work
# from a Claude session can never strand invisibly on a branch. The PR
# list is the inbox; the machinery /sync sweep reads it locally.
#
# Known limit: a PR opened by this workflow's own token does not trigger
# the pull_request CI run. Checks appear on the next human push to the
# branch, or when the PR is marked ready for review.
name: claude-branch-pr

on:
  push:
    branches: ['claude/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  open-draft-pr:
    runs-on: ubuntu-latest
    steps:
      - name: open draft PR if none exists
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "open PR already exists for $BRANCH"
            exit 0
          fi
          title=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.message' | head -1)
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --draft \
            --title "$title" \
            --body "Opened automatically: a Claude session pushed this branch. Review, then merge or close. (claude-branch-pr workflow)" \
            || echo "no PR created (branch may have no commits ahead of main)"
